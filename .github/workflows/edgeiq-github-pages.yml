name: EDGEiQ Frontend Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edgeiq-frontend-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec -- tsc -b
      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build
      - name: Verify frontend build
        run: |
          test -s dist/index.html
          test "$(find dist/assets -maxdepth 1 -name 'edgeiq-app-*.js' -type f | wc -l)" -gt 0
          test "$(find dist/assets -maxdepth 1 -name 'edgeiq-*.css' -type f | wc -l)" -gt 0

# Production GitHub Pages deployment is intentionally owned by
# edgeiq-current-intelligence-pages.yml so a UI-only build can never
# overwrite the live current meeting/race data feeds with an empty dist/data.
