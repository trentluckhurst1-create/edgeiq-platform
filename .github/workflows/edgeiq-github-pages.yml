name: EDGEiQ GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'requirements-pages.txt'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/edgeiq-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edgeiq-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install data-refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pages.txt
          python -m playwright install --with-deps chromium

      - name: Refresh current three-day EDGEiQ data
        env:
          TZ: Australia/Melbourne
        run: python scripts/ensure_edgeiq_current_data_rollover_v1.py

      - name: Verify Pages data is current
        env:
          TZ: Australia/Melbourne
        run: python scripts/ensure_edgeiq_current_data_rollover_v1.py --check-only

      - name: Build lightweight Meetings summary
        env:
          TZ: Australia/Melbourne
        run: python scripts/build_edgeiq_meetings_summary_feed_v1.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm exec -- tsc -b

      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build

      - name: Verify current data is in Pages artifact
        run: |
          test -s dist/data/edgeiq_three_day_window_v1.json
          test -s dist/data/edgeiq_three_day_product_catalog_v1.json
          test -s dist/data/edgeiq_meetings_summary_feed_v1.json
          test -s dist/data/edgeiq_vic_three_day_race_list_v1.csv
          python - <<'PY'
          import json
          from pathlib import Path
          window = json.loads(Path('dist/data/edgeiq_three_day_window_v1.json').read_text(encoding='utf-8'))
          summary_path = Path('dist/data/edgeiq_meetings_summary_feed_v1.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          print('PAGES_DATA_TODAY=' + str(window.get('today', '')))
          print('PAGES_DATA_TOMORROW=' + str(window.get('tomorrow', '')))
          print('PAGES_DATA_DAY_PLUS_2=' + str(window.get('dayPlus2', '')))
          print('MEETINGS_SUMMARY_BYTES=' + str(summary_path.stat().st_size))
          print('MEETINGS_SUMMARY_DAYS=' + str(len(summary.get('days', []))))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
