name: EDGEiQ GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'requirements-pages.txt'
      - '.github/workflows/edgeiq-github-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edgeiq-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - name: Install data-refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pages.txt
          python -m playwright install --with-deps chromium
      - name: Refresh current Racing.com race and runner data
        run: python scripts/build_edgeiq_racingcom_three_day_race_list_v1.py
      - name: Build current three-day catalogue
        run: python scripts/build_edgeiq_three_day_product_catalog_v1.py
      - name: Gate current catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/edgeiq_three_day_product_catalog_v1.json')
          if not p.exists(): raise SystemExit('catalogue missing')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          meetings=d.get('meetings') or []
          races=sum(len(m.get('races') or []) for m in meetings)
          runners=sum(len(r.get('runners') or []) for m in meetings for r in (m.get('races') or []))
          if not meetings or not races or not runners: raise SystemExit(f'incomplete catalogue meetings={len(meetings)} races={races} runners={runners}')
          print(f'catalogue PASS meetings={len(meetings)} races={races} runners={runners}')
          PY
      - name: Build lazy meeting runtime feeds
        run: python scripts/build_edgeiq_lazy_meeting_feeds_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm exec -- tsc -b
      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build
      - run: rm -f dist/data/edgeiq_three_day_product_catalog_v1.json
      - name: Verify Pages data
        run: |
          test -s dist/data/edgeiq_meetings_summary_feed_v1.json
          test -d dist/data/meetings
          test "$(find dist/data/meetings -name '*.json' -type f | wc -l)" -gt 0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy production data and UI
        id: deployment
        uses: actions/deploy-pages@v4
