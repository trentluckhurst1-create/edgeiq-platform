name: EDGEiQ Frontend Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm exec -- tsc -b

      - name: Vite production build
        run: npm exec -- vite build
