name: EDGEiQ Frontend Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: edgeiq-frontend-pages
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm exec -- tsc -b

      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build

      - name: Preserve latest production runtime data
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/edgeiq-github-pages.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$run_id"
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name=="github-pages") | .id' | head -1)
          test -n "$artifact_id"
          mkdir -p /tmp/edgeiq-pages
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/pages.zip
          unzip -q /tmp/pages.zip -d /tmp/edgeiq-pages
          tar -xf /tmp/edgeiq-pages/artifact.tar -C /tmp/edgeiq-pages
          test -s /tmp/edgeiq-pages/data/edgeiq_meetings_summary_feed_v1.json
          rm -rf dist/data
          cp -a /tmp/edgeiq-pages/data dist/data
          echo "RUNTIME_DATA_SEEDED_FROM_RUN=$run_id"

      - name: Rebuild current Race intelligence
        if: github.event_name != 'pull_request'
        env:
          EDGEIQ_DATA_DIR: dist/data
        run: |
          set -euo pipefail
          python scripts/build_edgeiq_current_race_intelligence_feed_v3.py
          test -s dist/data/edgeiq_race_intelligence_feed_v2.csv
          head -2 dist/data/edgeiq_race_intelligence_feed_v2.csv

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 10
    steps:
      - name: Deploy UI with preserved runtime data
        id: deployment
        uses: actions/deploy-pages@v4
