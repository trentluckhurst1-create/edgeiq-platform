name: EDGEiQ Research Profitability Program

on:
  push:
    branches:
      - research/profitability-program-20261004
    paths:
      - "scripts/research/**"
      - ".github/workflows/research-profitability-program.yml"
  workflow_dispatch:
    inputs:
      lab:
        description: "Research lab to run"
        required: true
        default: "245a"
        type: choice
        options:
          - "245a"
          - "245b1"
          - "245b-l27"
          - "bootstrap"

permissions:
  contents: read

jobs:
  research-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/profitability-program-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy scikit-learn
      - name: Select research lab
        shell: bash
        run: |
          LAB="${{ github.event.inputs.lab }}"
          if [ -z "$LAB" ]; then
            case "${{ github.event.head_commit.message }}" in
              *LAB245B-L27*|*lab245b-l27*|*LAB245B_L27*|*lab245b_l27*) LAB="245b-l27" ;;
              *LAB245B*|*lab245b*) LAB="245b1" ;;
              *) LAB="245a" ;;
            esac
          fi
          echo "LAB=$LAB" >> "$GITHUB_ENV"
      - name: Run LAB245A bridge audit
        if: env.LAB == '245a'
        run: python scripts/research/run_lab245a_performance_outcome_bridge_audit.py
      - name: Compile LAB245B governed chain
        if: env.LAB == '245b1'
        run: |
          python -m py_compile scripts/research/build_lab245b_warehouse_runner_lvs.py
          python -m py_compile scripts/research/run_lab245b_target_parity_audit.py
          python -m py_compile scripts/research/build_lab245b_compact_performance_bridge.py
          python -m py_compile scripts/research/run_lab245b1_next_performance_forecast.py
          python -m py_compile scripts/research/run_lab245b2_probability_challenger.py
          python -m py_compile scripts/research/run_lab245b3_selective_betting_forensics.py
          python -m py_compile scripts/research/run_lab245b4_sealed_holdout.py
      - name: Build and run LAB245B1 next-performance forecast
        if: env.LAB == '245b1'
        run: |
          # Historical runner-LVS authority is parity evidence only because its benchmark was all-history.
          # Forecasting labels must be reconstructed with strict date-PIT standards.
          python scripts/research/build_lab245b_warehouse_runner_lvs.py
          python scripts/research/run_lab245b_target_parity_audit.py
          python scripts/research/build_lab245b_compact_performance_bridge.py
          python scripts/research/run_lab245b1_next_performance_forecast.py
          python scripts/research/run_lab245b2_probability_challenger.py
          python scripts/research/run_lab245b3_selective_betting_forensics.py
          python scripts/research/run_lab245b4_sealed_holdout.py
      - name: Run LAB245B certified LAB027 next-performance challenger
        if: env.LAB == '245b-l27'
        run: python scripts/research/run_lab245b_l27_next_performance.py
      - name: Run governed research bootstrap
        if: env.LAB == 'bootstrap'
        run: python scripts/research/profitability_program_bootstrap.py
      - name: Upload research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeiq-profitability-${{ env.LAB }}
          path: outputs/research/profitability_program/
          if-no-files-found: warn
