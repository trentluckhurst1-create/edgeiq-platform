name: EDGEiQ Research Profitability Program

on:
  push:
    branches:
      - research/profitability-program-20261004
    paths:
      - "scripts/research/**"
      - ".github/workflows/research-profitability-program.yml"
  workflow_dispatch:
    inputs:
      lab:
        description: "Research lab to run"
        required: true
        default: "245a"
        type: choice
        options:
          - "245a"
          - "245b1"
          - "245b-l27"
          - "245b4-holdout"
          - "bootstrap"
          - "245d5"
          - "245d6"
          - "245d7"
          - "245d8"
          - "245d9"
          - "245d10"
          - "245d11"
          - "245d12"
          - "245d13"
          - "245d14"
          - "245d15"
          - "245d16"
          - "245d16b"
          - "245d17"

permissions:
  contents: read

jobs:
  research-lab:
    runs-on: ${{ (startsWith(github.event.inputs.lab, '245d') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'LAB245D'))) && fromJSON('["self-hosted","Windows","X64","edgeiq-research"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/profitability-program-20261004
          fetch-depth: 2
      - uses: actions/setup-python@v5
        if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'LAB245D')) && github.event.inputs.lab != '245d5' }}
        with:
          python-version: "3.11"
      - name: Install research dependencies
        if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'LAB245D')) && github.event.inputs.lab != '245d5' }}
        run: python -m pip install --disable-pip-version-check pandas numpy scipy scikit-learn
      - name: Select research lab
        if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'LAB245D')) && github.event.inputs.lab != '245d5' }}
        shell: bash
        run: |
          LAB="${{ github.event.inputs.lab }}"
          if [ -z "$LAB" ]; then
            if echo "${{ github.event.head_commit.message }}" | grep -Eiq 'LAB245D5|lab245d5'; then
              LAB="245d5"
            fi
            CHANGED="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
            if [ -n "$LAB" ]; then
              :
            elif echo "$CHANGED" | grep -Eiq '^scripts/research/.*lab245b.*l27'; then
              LAB="245b-l27"
            elif echo "$CHANGED" | grep -Eiq '^scripts/research/.*lab245b'; then
              LAB="245b1"
            else
              case "${{ github.event.head_commit.message }}" in
                *LAB245B-L27*|*lab245b-l27*|*LAB245B_L27*|*lab245b_l27*|*"LAB245B L27"*|*"lab245b l27"*) LAB="245b-l27" ;;
                *LAB245B*|*lab245b*) LAB="245b1" ;;
                *) LAB="245a" ;;
              esac
            fi
          fi
          echo "LAB=$LAB" >> "$GITHUB_ENV"
      - name: Run LAB245A bridge audit
        if: env.LAB == '245a'
        run: python scripts/research/run_lab245a_performance_outcome_bridge_audit.py
      - name: Smoke LAB245B contracts
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: |
          python -m py_compile scripts/research/run_lab245b_contract_smoke.py
          python scripts/research/run_lab245b_contract_smoke.py
      - name: Compile LAB245B preflight
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: python -m py_compile scripts/research/run_lab245b_preflight.py
      - name: Compile LAB245B launcher
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: python -m py_compile scripts/research/run_lab245b_preholdout_chain.py
      - name: Compile and verify LAB245B target builder
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: |
          python -m py_compile scripts/research/build_lab245b_warehouse_runner_lvs.py
          python -m py_compile scripts/research/run_lab245b_vector_pit_equivalence_smoke.py
          python scripts/research/run_lab245b_vector_pit_equivalence_smoke.py
      - name: Compile LAB245B parity audit
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: python -m py_compile scripts/research/run_lab245b_target_parity_audit.py
      - name: Compile LAB245B bridge and B1
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: |
          python -m py_compile scripts/research/build_lab245b_compact_performance_bridge.py
          python -m py_compile scripts/research/run_lab245b1_next_performance_forecast.py
      - name: Compile LAB245B B2 and B3
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: |
          python -m py_compile scripts/research/run_lab245b2_probability_challenger.py
          python -m py_compile scripts/research/run_lab245b3_selective_betting_forensics.py
      - name: Compile LAB245B holdout and L27
        if: env.LAB == '245b1' || env.LAB == '245b-l27'
        run: |
          python -m py_compile scripts/research/run_lab245b4_sealed_holdout.py
          python -m py_compile scripts/research/run_lab245b_l27_next_performance.py
      - name: Check LAB245B data authority
        if: env.LAB == '245b1'
        shell: bash
        run: |
          if [ -f docs/performance-intelligence/warehouse/edgeiq_performance_fact_warehouse_v1.csv ]; then
            echo "LAB245B_DATA_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "LAB245B_DATA_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Full execution deferred: immutable performance warehouse is not present on this GitHub runner. Legacy runner-LVS is parity-only."
          fi
      - name: Build and run LAB245B1 next-performance forecast
        if: env.LAB == '245b1' && env.LAB245B_DATA_AVAILABLE == 'true'
        run: |
          python scripts/research/run_lab245b_preholdout_chain.py
          echo "2025-2026 HOLDOUT REMAINS SEALED: LAB245B4 requires explicit manual dispatch."
      - name: Check explicit LAB245B4 holdout prerequisites
        if: env.LAB == '245b4-holdout'
        shell: bash
        run: |
          if [ -f outputs/research/profitability_program/lab245b/LAB245B_WAREHOUSE_RUNNER_LVS.csv ] && [ -f outputs/research/profitability_program/lab245b/LAB245B_COMPACT_PERFORMANCE_BRIDGE.csv ] && [ -f outputs/research/profitability_program/lab245b/LAB245B3_AUDIT.json ]; then
            echo "LAB245B4_DATA_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "LAB245B4_DATA_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "LAB245B4 HOLDOUT REMAINS SEALED: governed preholdout artifacts are unavailable on this runner."
          fi
      - name: Explicitly open LAB245B4 sealed forensic holdout
        if: env.LAB == '245b4-holdout' && env.LAB245B4_DATA_AVAILABLE == 'true'
        run: |
          python -m py_compile scripts/research/run_lab245b4_sealed_holdout.py
          python scripts/research/run_lab245b4_sealed_holdout.py
      - name: Check LAB245B L27 data authority
        if: env.LAB == '245b-l27'
        shell: bash
        run: |
          if [ -f outputs/research/model_lab_027/certified_pre_race_feature_matrix_027.csv ]; then
            echo "LAB245B_L27_DATA_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "LAB245B_L27_DATA_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "L27 full execution deferred: ignored certified feature matrix is not present on this GitHub runner."
          fi
      - name: Run LAB245B certified LAB027 next-performance challenger
        if: env.LAB == '245b-l27' && env.LAB245B_L27_DATA_AVAILABLE == 'true'
        run: python scripts/research/run_lab245b_l27_next_performance.py
      - name: Run LAB245D5 race-relative HGB challenger
        if: ${{ github.event.inputs.lab == '245d5' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'LAB245D5')) }}
        shell: powershell
        run: |
          $ResearchRoot = "C:\\EDGEIQ_PROFITABILITY_RESEARCH"
          $Bridge = Join-Path $ResearchRoot "outputs\\research\\profitability_program\\lab245b\\LAB245B_COMPACT_PERFORMANCE_BRIDGE.csv"
          if (-not (Test-Path $Bridge)) { throw "LAB245B compact bridge missing: $Bridge" }
          $SourceScript = Join-Path $env:GITHUB_WORKSPACE "scripts\\research\\run_lab245d5_race_relative_hgb.py"
          $LocalScript = Join-Path $ResearchRoot "scripts\\research\\run_lab245d5_race_relative_hgb.py"
          Copy-Item $SourceScript $LocalScript -Force
          python -m py_compile $LocalScript
          Push-Location $ResearchRoot
          try { python $LocalScript } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "LAB245D5 failed" }
