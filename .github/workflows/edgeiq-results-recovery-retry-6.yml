name: EDGEiQ Results Recovery Retry 6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run recovery unit guards
        run: node scripts/recovery/edgeiq_graphql_recovery_retry_6_unit_tests.cjs

      - name: Validate six-meeting retry manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const file = "scripts/recovery/edgeiq_manifest_RECOVERY_RETRY_6_V1.json";
          const rows = JSON.parse(fs.readFileSync(file, "utf8"));
          const expected = [
            ["2026-07-03", "MOE"],
            ["2026-07-03", "WARRACKNABEAL"],
            ["2026-07-04", "SPORTSBET-WANGARATTA"],
            ["2026-07-12", "SPORTSBET-BALLARAT"],
            ["2026-07-20", "SPORTSBET-PAKENHAM SYNTHETIC"],
            ["2026-08-09", "BET365 ECHUCA"],
          ];
          if (!Array.isArray(rows) || rows.length !== 6) throw new Error(`Expected 6 retry meetings, got ${rows.length}`);
          for (const [meeting_date, track] of expected) {
            if (!rows.some(r => r.meeting_date === meeting_date && r.track === track)) {
              throw new Error(`Missing retry meeting: ${meeting_date}|${track}`);
            }
          }
          if (rows.some(r => /trial|jumpout/i.test(`${r.track} ${r.meeting_url}`))) {
            throw new Error("Trial/jumpout leakage in retry manifest");
          }
          console.log("RETRY_MANIFEST_MEETINGS=6");
          console.log("RETRY_MANIFEST_VALID=YES");
          NODE

      - name: Retry six Racing.com meetings
        id: recovery
        continue-on-error: true
        run: node scripts/recovery/edgeiq_graphql_result_recovery_retry_6_v1.cjs

      - name: Audit retry outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f recovery-output/edgeiq_graphql_recovery_retry_6_v1_machine_summary.env ]; then
            cat recovery-output/edgeiq_graphql_recovery_retry_6_v1_machine_summary.env
          else
            echo "GOVERNANCE_STATUS=FAIL"
            echo "SUMMARY_FILE_MISSING=YES"
          fi

      - name: Upload retry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeiq-results-recovery-retry-6-v1
          path: recovery-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Final recovery status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="FAIL"
          if [ -f recovery-output/edgeiq_graphql_recovery_retry_6_v1_machine_summary.env ]; then
            status="$(grep '^GOVERNANCE_STATUS=' recovery-output/edgeiq_graphql_recovery_retry_6_v1_machine_summary.env | cut -d= -f2 || true)"
          fi
          echo "FINAL_GOVERNANCE_STATUS=${status}"
          if [ "${status}" != "PASS" ]; then
            exit 1
          fi
