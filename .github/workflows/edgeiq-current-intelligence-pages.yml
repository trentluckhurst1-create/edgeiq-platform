name: EDGEiQ Current Intelligence Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_edgeiq_racingcom_three_day_race_list_v1.py'
      - 'scripts/build_edgeiq_three_day_product_catalog_v1.py'
      - 'scripts/build_edgeiq_current_race_entry_fact_v1.py'
      - 'scripts/enrich_edgeiq_catalogue_last5_v1.py'
      - 'scripts/build_edgeiq_lazy_meeting_feeds_v1.py'
      - 'LIVE_PERFORMANCE_BUILDERS/**'
      - '.github/workflows/edgeiq-current-intelligence-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edgeiq-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - name: Install data-refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pages.txt
          python -m playwright install --with-deps chromium
      - name: Refresh current Racing.com race and runner data
        run: python scripts/build_edgeiq_racingcom_three_day_race_list_v1.py
      - name: Build current three-day catalogue
        run: python scripts/build_edgeiq_three_day_product_catalog_v1.py
      - name: Populate current last-five form
        run: python scripts/enrich_edgeiq_catalogue_last5_v1.py
      - name: Build current race-entry facts
        run: python scripts/build_edgeiq_current_race_entry_fact_v1.py
      - name: Build performance base dependencies
        run: python LIVE_PERFORMANCE_BUILDERS/run_edgeiq_performance_intelligence_production_v2.py
      - name: Build governed current ERR and projected performance
        run: python LIVE_PERFORMANCE_BUILDERS/run_edgeiq_victoria_performance_intelligence_refresh_v1.py
      - name: Gate current intelligence
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          cat=json.loads(Path('public/data/edgeiq_three_day_product_catalog_v1.json').read_text(encoding='utf-8-sig'))
          dates={str(m.get('date',''))[:10] for m in cat.get('meetings',[])}
          p=Path('public/data/edgeiq_race_intelligence_feed_v2.csv')
          if not p.exists(): raise SystemExit('intelligence feed missing')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          current=[r for r in rows if r.get('race_date') in dates]
          print(f'INTELLIGENCE current_rows={len(current)} dates={sorted(dates)}')
          if not current: raise SystemExit('no current intelligence rows')
          PY
      - name: Build lazy meeting runtime feeds
        run: python scripts/build_edgeiq_lazy_meeting_feeds_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm exec -- tsc -b
      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build
      - run: rm -f dist/data/edgeiq_three_day_product_catalog_v1.json
      - name: Verify Pages data
        run: |
          test -s dist/data/edgeiq_meetings_summary_feed_v1.json
          test -s dist/data/edgeiq_race_intelligence_feed_v2.csv
          test -d dist/data/meetings
          test "$(find dist/data/meetings -name '*.json' -type f | wc -l)" -gt 0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy current data and UI
        id: deployment
        uses: actions/deploy-pages@v4
