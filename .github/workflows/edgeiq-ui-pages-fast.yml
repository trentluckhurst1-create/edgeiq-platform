name: EDGEiQ Frontend Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/edgeiq-ui-pages-fast.yml'

permissions:
  contents: read

# UI-only builds validate the application but never own the production Pages
# deployment. A Vite-only Pages artifact contains no freshly generated racing
# feeds and previously replaced the live data layer with an incomplete site.
concurrency:
  group: edgeiq-frontend-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm exec -- tsc -b

      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build

      - name: Confirm production bundle
        run: test -s dist/index.html
