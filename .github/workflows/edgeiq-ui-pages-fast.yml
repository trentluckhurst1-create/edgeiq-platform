name: EDGEiQ Populated Production Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'public/*.css'
      - 'index.html'
      - 'vite.config.*'
      - 'scripts/build_edgeiq_racingcom_three_day_race_list_v1.py'
      - 'scripts/build_edgeiq_three_day_product_catalog_v1.py'
      - 'scripts/enrich_edgeiq_catalogue_last5_v1.py'
      - 'scripts/build_edgeiq_current_race_entry_fact_v1.py'
      - 'scripts/build_edgeiq_lazy_meeting_feeds_v1.py'
      - 'scripts/build_edgeiq_racecourse_weather_feed_v1.py'
      - 'scripts/build_edgeiq_racing_australia_track_conditions_v1.py'
      - '.github/workflows/edgeiq-ui-pages-fast.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edgeiq-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Materialize dashboard hero JPEG
        run: |
          curl -L --fail --retry 3 --silent --show-error \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/LusterKingsPlate2026.jpg" \
            -o public/assets/edgeiq-dashboard-hero.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/assets/edgeiq-dashboard-hero.jpg")
          b=p.read_bytes()
          assert len(b)>8000
          assert b[:3]==b"\xff\xd8\xff"
          print(f"EDGEIQ_HERO_SOURCE_PASS bytes={len(b)}")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - name: Install dashboard data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pages.txt
          python -m playwright install --with-deps chromium
      - name: Refresh current Racing.com race and runner data
        timeout-minutes: 12
        run: python scripts/build_edgeiq_racingcom_three_day_race_list_v1.py
      - name: Build official Racing Australia meeting metadata
        run: python scripts/build_edgeiq_racing_australia_track_conditions_v1.py
      - name: Build current three-day catalogue
        run: python scripts/build_edgeiq_three_day_product_catalog_v1.py
      - name: Populate current last-five form
        run: python scripts/enrich_edgeiq_catalogue_last5_v1.py
      - name: Build current race-entry facts
        run: python scripts/build_edgeiq_current_race_entry_fact_v1.py
      - name: Build dashboard meeting feeds
        run: python scripts/build_edgeiq_lazy_meeting_feeds_v1.py
      - name: Verify populated meeting metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/data/edgeiq_meetings_summary_feed_v1.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          today=next(x for x in d["days"] if x["key"]=="TODAY")
          for m in today["meetings"]:
              print("MEETING_METADATA",m["meeting"],"RAIL=",m["rail"],"TRACK=",m["track"])
              assert m["rail"] not in ("","—","Not supplied"), m
              assert m["track"] not in ("","—","Not supplied"), m
          PY
      - name: Build racecourse weather feed
        run: python scripts/build_edgeiq_racecourse_weather_feed_v1.py
      - name: Gate dashboard feeds
        run: |
          test -s public/data/edgeiq_meetings_summary_feed_v1.json
          test -s public/data/edgeiq_racing_australia_track_conditions_v1.json
          test -d public/data/meetings
          test -s public/data/edgeiq_racecourse_weather_feed_v1.json
          test "$(find public/data/meetings -name '*.json' -type f | wc -l)" -gt 0
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('public/data/edgeiq_meetings_summary_feed_v1.json').read_text(encoding='utf-8-sig'))
          days=feed.get('days',[])
          meetings=sum(len(d.get('meetings',[])) for d in days)
          races=sum(sum(int(m.get('races',0) or 0) for m in d.get('meetings',[])) for d in days)
          print(f'DASHBOARD days={len(days)} meetings={meetings} races={races}')
          if len(days) < 3: raise SystemExit('dashboard summary has fewer than three days')
          if meetings <= 0 or races <= 0: raise SystemExit('dashboard summary is empty')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm exec -- tsc -b
      - name: Vite production build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm exec -- vite build
      - name: Verify dashboard hero JPEG
        run: |
          test -s dist/assets/edgeiq-dashboard-hero.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/assets/edgeiq-dashboard-hero.jpg")
          b=p.read_bytes()
          assert len(b)>8000
          assert b[:3]==b"\xff\xd8\xff"
          print(f"EDGEIQ_HERO_PASS bytes={len(b)} path={p}")
          PY
      - name: Verify production bundle
        run: |
          test -s dist/index.html
          test -s dist/data/edgeiq_meetings_summary_feed_v1.json
          test -s dist/data/edgeiq_racing_australia_track_conditions_v1.json
          test -d dist/data/meetings
          test -s dist/data/edgeiq_racecourse_weather_feed_v1.json
          test "$(find dist/data/meetings -name '*.json' -type f | wc -l)" -gt 0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy populated dashboard
        id: deployment
        uses: actions/deploy-pages@v4

# rail-rating-parser-trigger: official Racing Australia meeting metadata active merge
