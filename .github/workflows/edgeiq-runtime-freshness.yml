name: EDGEiQ Runtime Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: edgeiq-runtime-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EDGEIQ_DATA_ORIGIN: ${{ vars.EDGEIQ_DATA_ORIGIN }}
      EDGEIQ_PRODUCTION_HOST: ${{ vars.EDGEIQ_PRODUCTION_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configured data origin
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EDGEIQ_DATA_ORIGIN" || { echo 'Missing EDGEIQ_DATA_ORIGIN repository variable'; exit 1; }
          EDGEIQ_PRODUCTION_HOST="${EDGEIQ_PRODUCTION_HOST:-https://edgeiq-platform.pages.dev}"
          echo "EDGEIQ_PRODUCTION_HOST=$EDGEIQ_PRODUCTION_HOST" >> "$GITHUB_ENV"

      - name: Verify production runtime freshness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_edgeiq_runtime_freshness_v1.py \
            --data-origin "$EDGEIQ_DATA_ORIGIN" \
            --production-host "$EDGEIQ_PRODUCTION_HOST"
