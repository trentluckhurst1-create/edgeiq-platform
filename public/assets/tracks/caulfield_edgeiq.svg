<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1420" role="img" aria-labelledby="title desc">
  <title id="title">EDGEiQ Track Map - Caulfield</title>
  <desc id="desc">Caulfield Course Proper and Caulfield Heath map rebuilt from the supplied official map geometry with EDGEiQ styling.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="52%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#08182a" />
      <stop offset="55%" stop-color="#07111f" />
      <stop offset="100%" stop-color="#03070d" />
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#03070d" stop-opacity="0.8" />
    </linearGradient>
    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8af2da" flood-opacity="0.2"/>
    </filter>
    <filter id="softCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style><![CDATA[
      svg { background:#03070d; }
      .bg { fill:url(#bgGlow); }
      .grain { opacity:.2; }
      .eyebrow { font:700 18px Inter, Arial, sans-serif; letter-spacing:5px; fill:#8af2da; }
      .title { font:900 66px Inter, Arial, sans-serif; letter-spacing:3px; fill:#ffffff; }
      .subtitle { font:800 18px Inter, Arial, sans-serif; letter-spacing:3px; fill:#8af2da; }
      .card { fill:url(#cardFill); stroke:rgba(138,242,218,.15); stroke-width:1; rx:18; filter:url(#softCardShadow); backdrop-filter:blur(8px); }
      .table-head { font:800 13px Inter, Arial, sans-serif; letter-spacing:1.2px; fill:#8af2da; }
      .table-label { font:800 15px Inter, Arial, sans-serif; letter-spacing:.5px; fill:#ffffff; }
      .table-value { font:800 17px Inter, Arial, sans-serif; fill:#ffffff; }
      .label { font:800 13px Inter, Arial, sans-serif; letter-spacing:2.5px; fill:#8af2da; }
      .muted { fill:#a8b3c9; font:600 13px Inter, Arial, sans-serif; letter-spacing:.9px; }
      .pill rect { fill:rgba(7,17,31,.72); stroke:rgba(138,242,218,.15); stroke-width:1; }
      .pill-title { font:800 11px Inter, Arial, sans-serif; letter-spacing:1px; fill:#a8b3c9; }
      .pill-value { font:800 20px Inter, Arial, sans-serif; fill:#ffffff; }
      .pill-sub { font:800 10px Inter, Arial, sans-serif; letter-spacing:.7px; fill:#ffffff; }
      .accent { fill:#8af2da; }
      .line-icon { fill:none; stroke:#ffffff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.94; }
      .track-group { filter:url(#trackGlow); shape-rendering:geometricPrecision; }
      .track-path { fill:none; stroke-linecap:round; stroke-linejoin:round; shape-rendering:geometricPrecision; }
      .course-base { stroke:rgba(244,247,251,.92); stroke-width:16; }
      .course-cut { stroke:#07111d; stroke-width:8; }
      .course-edge { stroke:rgba(138,242,218,.45); stroke-width:1.25; }
      .heath-base { stroke:rgba(124,242,138,.86); stroke-width:12; }
      .heath-cut { stroke:#07111d; stroke-width:4.5; }
      .heath-edge { stroke:rgba(138,242,218,.45); stroke-width:1; }
      .surface-separator { fill:none; stroke:#06111f; stroke-width:16; stroke-linecap:round; stroke-linejoin:round; opacity:.98; shape-rendering:geometricPrecision; }
      .start-dot { stroke:#06111f; stroke-width:1.8; }
      .start-tick { fill:none; stroke-width:1.5; stroke-linecap:round; opacity:.88; }
      .course-tick { stroke:#f4f7fb; }
      .heath-tick { stroke:#8af2da; }
      .course-dot { fill:#f2f4f7; }
      .heath-dot { fill:#8af2da; }
      .marker-text { font:900 17px Inter, Arial, sans-serif; letter-spacing:.15px; paint-order:stroke; stroke:#06111f; stroke-width:4; stroke-linejoin:round; }
      .course-text { fill:#ffffff; }
      .heath-text { fill:#8af2da; }
      .winning-line { stroke:#ffffff; stroke-width:5; stroke-linecap:round; }
      .winning-dot { fill:#b91c1c; stroke:#ffffff; stroke-width:3; }
      .winning-text { font:900 19px Inter, Arial, sans-serif; fill:#ffffff; }
      .legend-text { font:800 16px Inter, Arial, sans-serif; fill:#ffffff; }
      .legend-line-course { stroke:#f2f4f7; stroke-width:12; stroke-linecap:round; }
      .legend-line-heath { stroke:#8af2da; stroke-width:12; stroke-linecap:round; }
      .panel-title { font:800 16px Inter, Arial, sans-serif; letter-spacing:3px; fill:#8af2da; }
      .metric-label { font:800 11px Inter, Arial, sans-serif; letter-spacing:1px; fill:#a8b3c9; }
      .metric-value { font:800 18px Inter, Arial, sans-serif; fill:#ffffff; }
      .divider { stroke:rgba(168,179,201,.24); stroke-width:1; }
    ]]></style>
